services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pronosticat}:${POSTGRES_PASSWORD:-pronosticat}@db:5432/${POSTGRES_DB:-pronosticat}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    profiles: [full]
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      # Override host env files — inside Docker the DB host is `db`, not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-pronosticat}:${POSTGRES_PASSWORD:-pronosticat}@db:5432/${POSTGRES_DB:-pronosticat}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-min-32-characters-long}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      # Mask host env files so Next.js uses container environment instead
      - ./docker/empty.env:/app/.env:ro
      - ./docker/empty.env:/app/.env.local:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  cron:
    profiles: [full]
    build:
      context: ./docker/cron
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_URL: http://app:3000/api/cron/sync
      CRON_SCHEDULE: ${CRON_SCHEDULE:-*/10 * * * *}
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_node_modules:
