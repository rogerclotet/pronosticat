name: pronosticat

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pronosticat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pronosticat}
      POSTGRES_DB: ${POSTGRES_DB:-pronosticat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pronosticat} -d ${POSTGRES_DB:-pronosticat}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
