"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = """
.env.local
.env
"""

[scripts]
setup = """
[ -f .env ] || cp .env.example .env
docker compose -f compose.yaml -f compose.dev.yaml up -d --build db migrate
"""
archive = "docker compose -f compose.yaml -f compose.dev.yaml --profile full down"
run_mode = "nonconcurrent"

[scripts.run.dev]
command = """
set -a
[ -f .env.local ] && . ./.env.local
[ -f .env ] && . ./.env
set +a
docker compose -f compose.yaml -f compose.dev.yaml --profile full up --build
"""
default = true
icon = "play"

preview_urls = [
  { url = "http://localhost:3000" }
]
