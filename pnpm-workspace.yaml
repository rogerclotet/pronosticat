# Next's standalone output traces a real file tree, and pnpm's default
# symlinked layout leaves transitive deps (@swc/helpers) outside it, so
# `node server.js` in the runner image fails to boot. A hoisted node_modules
# is what the tracer expects.
nodeLinker: hoisted
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# Patch-level bumps of transitive dependencies that carry advisories and have
# no fixed release reachable through their own parents.
overrides:
  nanoid: '>=3.3.18'
  js-yaml: '>=4.3.1'
minimumReleaseAgeExclude:
  - '@next/env@16.3.1'
  - '@next/swc-darwin-arm64@16.3.1'
  - '@next/swc-darwin-x64@16.3.1'
  - '@next/swc-linux-arm64-gnu@16.3.1'
  - '@next/swc-linux-arm64-musl@16.3.1'
  - '@next/swc-linux-x64-gnu@16.3.1'
  - '@next/swc-linux-x64-musl@16.3.1'
  - '@next/swc-win32-arm64-msvc@16.3.1'
  - '@next/swc-win32-x64-msvc@16.3.1'
  - next@16.3.1
  - '@next/eslint-plugin-next@16.3.1'
  - eslint-config-next@16.3.1
